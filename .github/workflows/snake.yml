name: Contribution snake
on:
  schedule: [{cron: "43 */12 * * *"}]   # twice a day
  workflow_dispatch:
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#24283b,#3d59a1,#7aa2f7,#7dcfff,#c0caf5
            dist/snake-light.svg?palette=github-light&color_snake=#8250df&color_dots=#ebedf0,#c8d1ff,#7aa2f7,#0969da,#0550ae
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
