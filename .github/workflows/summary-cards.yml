name: Profile summary cards
on:
  schedule: [{cron: "17 4 * * *"}]   # daily
  workflow_dispatch:
  push: {branches: [main]}
jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: America/New_York
          AUTO_PUSH: false
      - name: Keep only the tokyonight cards and commit
        run: |
          rm -rf stats && mkdir stats
          cp profile-summary-card-output/tokyonight/*.svg stats/
          rm -rf profile-summary-card-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A stats
          git diff --cached --quiet || { git commit -m "Update profile summary cards" && git push; }
